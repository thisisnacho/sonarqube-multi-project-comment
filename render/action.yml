name: SonarQube Multi-Project Render
description: Internal — renders the aggregated comment markdown. Use the parent composite action.
inputs:
  sonar-host-url:
    required: false
  sonar-token:
    required: false
  projects:
    required: false
  report-task-files:
    required: false
  pr-number:
    required: false
  comment-header:
    required: false
    default: SonarQube PR analysis
  icon-base-url:
    required: false
  footer:
    required: false
  fail-on-quality-gate:
    required: false
    default: 'false'
outputs:
  body-path:
    description: Path to the rendered comment body file.
  quality-gate:
    description: Overall quality gate (`OK` if every project passed, otherwise `ERROR`).
  results-json:
    description: JSON array of per-project results.
runs:
  using: node20
  main: dist/index.js
