sonar.projectKey=sonarqube-multi-project-comment
sonar.projectName=sonarqube-multi-project-comment

sonar.sources=render/src
sonar.tests=render/src
sonar.test.inclusions=render/src/**/*.test.ts
sonar.exclusions=render/dist/**,examples/**,render/src/**/*.test.ts

sonar.typescript.tsconfigPath=render/tsconfig.json
sonar.javascript.lcov.reportPaths=render/coverage/lcov.info
# index.ts is the orchestrator/composition root (heavy mocking required, low
# signal); types.ts is declarations only. Both stay in `sources` so issues /
# smells are still reported, but they don't drag the coverage gate.
sonar.coverage.exclusions=render/src/index.ts,render/src/types.ts
sonar.sourceEncoding=UTF-8
