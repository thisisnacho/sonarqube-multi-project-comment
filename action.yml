name: SonarQube Multi-Project PR Comment
description: Aggregate quality-gate results from multiple SonarQube projects into a single PR comment.
author: thisisnacho
branding:
  icon: message-square
  color: blue

inputs:
  # ---- Sonar / data inputs ----
  sonar-host-url:
    description: Base URL of the SonarQube/SonarCloud instance (e.g. https://sonarcloud.io).
    required: false
  sonar-token:
    description: Token used to authenticate against the SonarQube API.
    required: false
  projects:
    description: |
      Newline- or comma-separated list of projects in `LABEL|KEY` form (or just
      `KEY` to use the key as the label). Requires `sonar-host-url` and
      `sonar-token`.
    required: false
  report-task-files:
    description: |
      Glob (one per line) of `report-task.txt` files produced by the SonarScanner.
      The action reads each file, waits for SonarQube to finish processing the
      scan, then queries the API. Useful for matrix builds.
    required: false
  pr-number:
    description: Pull request number. Defaults to the PR number from the workflow context.
    required: false
  comment-header:
    description: Heading rendered at the top of the aggregated comment.
    required: false
    default: SonarQube PR analysis
  icon-style:
    description: |
      Where status icons live. `cloud` (default) uses the SonarSource-hosted
      icons on github.io and matches SonarCloud's PR decoration. Set to
      `community-plugin` for self-hosted SonarQube with the community branch
      plugin installed.
    required: false
    default: cloud
  icon-base-url:
    description: |
      Override the default icon base URL. Defaults to
      `https://sonarsource.github.io/sonarcloud-github-static-resources/v2`
      for `icon-style: cloud` and `<host>/static/communityBranchPlugin` for
      `community-plugin`.
    required: false
  footer:
    description: Optional text rendered below the table (wrapped in <sub>).
    required: false
  fail-on-quality-gate:
    description: Fail the action when any project's quality gate did not pass.
    required: false
    default: 'false'

  # ---- Bubbled-up sticky-pull-request-comment inputs ----
  github-token:
    description: Token used to post / update the PR comment. Defaults to `github.token`.
    required: false
    default: ${{ github.token }}
  sticky-header:
    description: |
      Unique identifier sticky-pull-request-comment uses to find this comment
      across runs. Change if you post multiple sticky comments to the same PR.
    required: false
    default: sonarqube-aggregate
  hide-and-recreate:
    description: |
      When true, hide the previous aggregated comment as outdated and post a
      fresh one. When false, edit the existing comment in place.
    required: false
    default: 'true'
  hide-classify:
    description: |
      Classifier passed to GitHub's minimizeComment mutation when hiding the
      previous comment. One of OUTDATED, RESOLVED, OFF_TOPIC, SPAM, DUPLICATE.
    required: false
    default: OUTDATED
  skip-unchanged:
    description: |
      When true, skip posting if the rendered body matches the existing
      comment. Default `false` so every run produces a fresh "outdated +
      new" pair, giving an unambiguous "this is the latest" signal even
      when the underlying numbers happen to be identical.
    required: false
    default: 'false'

outputs:
  quality-gate:
    description: Overall quality gate (`OK` if every project passed, otherwise `ERROR` / `NONE`).
    value: ${{ steps.render.outputs.quality-gate }}
  results-json:
    description: JSON array of per-project results.
    value: ${{ steps.render.outputs.results-json }}
  body-path:
    description: Path to the rendered comment body file.
    value: ${{ steps.render.outputs.body-path }}

runs:
  using: composite
  steps:
    # Invoke the bundled Node script directly via `${{ github.action_path }}`
    # so the path resolves to this action's own checkout, not the consumer's
    # workspace. Avoids the resolution edge cases of `uses: ./sub-action` in
    # composite actions (some runners resolve relative to $GITHUB_WORKSPACE
    # instead and fail with "Can't find 'action.yml' under .../render").
    - id: render
      shell: bash
      env:
        INPUT_SONAR-HOST-URL: ${{ inputs.sonar-host-url }}
        INPUT_SONAR-TOKEN: ${{ inputs.sonar-token }}
        INPUT_PROJECTS: ${{ inputs.projects }}
        INPUT_REPORT-TASK-FILES: ${{ inputs.report-task-files }}
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_COMMENT-HEADER: ${{ inputs.comment-header }}
        INPUT_ICON-STYLE: ${{ inputs.icon-style }}
        INPUT_ICON-BASE-URL: ${{ inputs.icon-base-url }}
        INPUT_FOOTER: ${{ inputs.footer }}
        INPUT_FAIL-ON-QUALITY-GATE: ${{ inputs.fail-on-quality-gate }}
      run: node "${{ github.action_path }}/render/dist/index.js"

    - if: steps.render.outputs.body-path != ''
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: ${{ inputs.sticky-header }}
        path: ${{ steps.render.outputs.body-path }}
        number: ${{ inputs.pr-number }}
        hide_and_recreate: ${{ inputs.hide-and-recreate }}
        hide_classify: ${{ inputs.hide-classify }}
        skip_unchanged: ${{ inputs.skip-unchanged }}
