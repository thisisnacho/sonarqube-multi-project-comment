name: Demo (report-task globs)

# End-to-end demo of the aggregator using the `report-task-files` input.
# Each scan job uploads its report-task.txt as an artifact; the aggregator
# downloads them all, polls the Compute Engine tasks, then queries results.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/projects/**
      - .github/workflows/demo-report-tasks.yml

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        project: [alpha, beta, gamma]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: examples/projects/${{ matrix.project }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-report-${{ matrix.project }}
          path: examples/projects/${{ matrix.project }}/.scannerwork/report-task.txt
          if-no-files-found: error

  aggregate:
    needs: scan
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sonar-report-*
          path: sonar-reports
      - uses: ./
        with:
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          report-task-files: sonar-reports/**/report-task.txt
          sticky-header: demo-report-tasks
