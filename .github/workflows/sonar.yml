name: Sonar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    # Forks can't access SONAR_TOKEN; skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar uses git blame for new-code detection; a shallow clone breaks it.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render/package-lock.json
      - name: Install + run tests with coverage
        working-directory: render
        run: |
          npm ci
          npm run test:coverage
          # vitest emits SF: paths relative to render/; rewrite so the
          # scanner (which runs from repo root) can resolve them.
          sed -i 's|^SF:|SF:render/|' coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
