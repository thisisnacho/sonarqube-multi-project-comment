name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet --exit-code dist/; then
            echo "::error::render/dist is out of date. Run 'npm run build' in render/ and commit."
            git diff dist/
            exit 1
          fi
