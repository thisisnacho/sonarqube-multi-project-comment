name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: render/.nvmrc
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify dist is in sync with src
        run: |
          if ! git diff --quiet --exit-code dist/; then
            echo "::error::render/dist is stale. Run 'npm run build' in render/ and commit the result."
            git diff dist/ | head -200
            exit 1
          fi
