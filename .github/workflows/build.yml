name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: render/.nvmrc
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify dist is in sync with src
        run: |
          if ! git diff --quiet --exit-code dist/; then
            echo "::error::render/dist is stale. Run 'npm run build' in render/ and commit the result."
            git diff dist/ | head -200
            exit 1
          fi
