name: E2E (projects list)

# End-to-end test of the aggregator using the explicit `projects` input.
# Scans three fake projects under examples/projects/ against a real Sonar
# instance and posts a single aggregated PR comment via the action under test.
#
# Path filtering happens inside a `changes` job rather than on the workflow
# trigger so the matrix and aggregate jobs always exist as check-runs and can
# be marked required in branch protection. When nothing relevant changed they
# skip cleanly (skipped == passing for required checks).

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - 'render/src/**'
              - 'render/dist/**'
              - 'render/action.yml'
              - 'action.yml'
              - 'examples/projects/**'
              - '.github/workflows/e2e-projects-list.yml'

  scan:
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.relevant == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        project: [alpha, beta, gamma]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
          projectBaseDir: examples/projects/${{ matrix.project }}
          # Block until SonarQube finishes processing so the aggregator can
          # query results immediately afterwards.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  aggregate:
    needs: [changes, scan]
    if: |
      always() &&
      needs.scan.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.relevant == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./
        with:
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          projects: |
            alpha|multi-comment-demo-alpha
            beta|multi-comment-demo-beta
            gamma|multi-comment-demo-gamma
          sticky-header: e2e-projects-list
