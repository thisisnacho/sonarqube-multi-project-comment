name: E2E (report-task globs)

# End-to-end test of the aggregator using the `report-task-files` input.
# Each scan job uploads its report-task.txt as an artifact; the aggregator
# downloads them all, waits for SonarQube to finish processing, then queries
# results via the action under test.
#
# Path filtering happens inside a `changes` job rather than on the workflow
# trigger so the matrix and aggregate jobs always exist as check-runs and can
# be marked required in branch protection. When nothing relevant changed they
# skip cleanly (skipped == passing for required checks).

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'render/src/**'
              - 'render/dist/**'
              - 'render/action.yml'
              - 'action.yml'
              - 'examples/projects/**'
              - '.github/workflows/e2e-report-tasks.yml'

  scan:
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.relevant == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        project: [alpha, beta, gamma]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: examples/projects/${{ matrix.project }}
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: sonar-report-${{ matrix.project }}
          path: examples/projects/${{ matrix.project }}/.scannerwork/report-task.txt
          if-no-files-found: error

  aggregate:
    needs: [changes, scan]
    if: |
      always() &&
      needs.scan.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.relevant == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: sonar-report-*
          path: sonar-reports
      - uses: ./
        with:
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          report-task-files: sonar-reports/**/report-task.txt
          sticky-header: e2e-report-tasks
