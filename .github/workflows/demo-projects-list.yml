name: Demo (projects list)

# End-to-end demo of the aggregator using the explicit `projects` input.
# Scans three dummy projects under examples/projects/ and posts a single
# aggregated PR comment.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/projects/**
      - .github/workflows/demo-projects-list.yml

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        project: [alpha, beta, gamma]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: examples/projects/${{ matrix.project }}
          # Block until SonarQube finishes processing so the aggregator can
          # query results immediately afterwards.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  aggregate:
    needs: scan
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          projects: |
            alpha|multi-comment-demo-alpha
            beta|multi-comment-demo-beta
            gamma|multi-comment-demo-gamma
          sticky-header: demo-projects-list
